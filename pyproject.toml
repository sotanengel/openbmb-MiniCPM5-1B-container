[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minicpm-container"
version = "0.1.0"
description = "Secure CLI chat container for openbmb/MiniCPM5-1B"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "huggingface_hub>=0.26",
]
inference = [
    "torch>=2.4",
    "transformers>=5.6",
    "accelerate>=0.33",
]

[project.scripts]
chat-login = "minicpm_container.chat_login:main"
chat-cli = "minicpm_container.chat_cli:main"
model-server = "minicpm_container.model_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests that require Docker or model weights",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
